{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QuickBite</title>
    <link rel="stylesheet" href="{% static 'css/menu.css' %}">
</head>
<body>
    <header class="site-header">
        {% include 'nav.html' %}
        <p class="brand">QuickBite</p>
        <h1>Our Menu</h1>
    </header>
    <main>
        <ul class="menu-list">
            {% for product in products %}
            <li>
                <article class="menu-card">
                    <img class="menu-card__image" src="{{ product.image_url }}" alt="{{ product.name }}">
                    <div class="menu-card__body">
                        <h2>{{ product.name }}</h2>
                        <p class="menu-card__description">{{ product.description }}</p>
                        <p class="menu-card__price">${{ product.price }}</p>
                        <form method="post" action="{% url 'cart_add' product.pk %}">
                            {% csrf_token %}
                            <button type="submit">Add to Cart</button>
                        </form>
                    </div>
                </article>
            </li>
            {% endfor %}
        </ul>
    </main>
</body>
</html>
